<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f7fafe" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0a0d10" media="(prefers-color-scheme: dark)" />
    <meta name="description" content="STES.tn : équipements, produits et installation de piscines en Tunisie. Livraison dans les 24 gouvernorats." />
    <title>STES.tn - Équipements de Piscines</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400..700;1,9..40,400&family=JetBrains+Mono:wght@400;500&family=Space+Grotesk:wght@400..700&family=Noto+Sans+Arabic:wght@400..700&display=swap" rel="stylesheet" />
    <script>
      // Apply the saved theme before the first paint (same rule as ThemeContext)
      try {
        var saved = localStorage.getItem('theme');
        var dark = saved ? saved === 'dark' : window.matchMedia('(prefers-color-scheme: dark)').matches;
        if (dark) document.documentElement.classList.add('dark');
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
