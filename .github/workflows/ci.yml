name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - run: npm ci

      - run: npm run lint

      # mongodb-memory-server downloads a MongoDB binary on first use
      - uses: actions/cache@v5
        with:
          path: ~/.cache/mongodb-binaries
          key: mongodb-binaries-${{ runner.os }}-${{ hashFiles('backend/package-lock.json') }}

      - run: npm test

      - name: Seed the database
        env:
          MONGODB_URI: mongodb://localhost:27017/stes-ci
          DEFAULT_ADMIN_EMAIL: admin@example.com
          DEFAULT_ADMIN_PASSWORD: ci-admin-password
        run: |
          npm run seed
          npm run seed:customers
          npm run seed:orders

      - name: Start the server and check it connects to MongoDB
        env:
          JWT_SECRET: ci-secret
          MONGODB_URI: mongodb://localhost:27017/stes-ci
          PORT: 9000
        run: |
          node server.js > server.log 2>&1 &
          healthy=false
          for attempt in $(seq 1 30); do
            if curl -fsS http://localhost:9000/api/health | grep -q '"database":"connected"'; then
              healthy=true
              break
            fi
            sleep 1
          done
          if [ "$healthy" != true ]; then
            echo "Server did not become healthy:"
            cat server.log
            exit 1
          fi
          echo "Server is up and connected to MongoDB"

          # Seeded customers must be able to log in (passwords hashed)
          curl -fsS -o /dev/null -X POST http://localhost:9000/api/customers/login \
            -H 'Content-Type: application/json' \
            -d '{"email":"ahmed.ben.ali@email.com","password":"password123"}'
          echo "Seeded customer can log in"

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci

      - run: npm run build
