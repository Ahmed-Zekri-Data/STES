name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - run: npm ci

      - run: npm run lint

      # mongodb-memory-server downloads a MongoDB binary on first use
      - uses: actions/cache@v4
        with:
          path: ~/.cache/mongodb-binaries
          key: mongodb-binaries-${{ runner.os }}-${{ hashFiles('backend/package-lock.json') }}

      - run: npm test

      - name: Start the server and check it connects to MongoDB
        env:
          JWT_SECRET: ci-secret
          MONGODB_URI: mongodb://localhost:27017/stes-ci
          PORT: 9000
        run: |
          node server.js > server.log 2>&1 &
          for attempt in $(seq 1 30); do
            if curl -fsS http://localhost:9000/api/health | grep -q '"database":"connected"'; then
              echo "Server is up and connected to MongoDB"
              exit 0
            fi
            sleep 1
          done
          echo "Server did not become healthy:"
          cat server.log
          exit 1

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci

      - run: npm run build
